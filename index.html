<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BND 'KNOCK ON' VOL.2 Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const tourData = [
            { id: 1, region: "韓國", city: "首爾", venue: "KSPO Dome", date: "2026 07/17–07/19", flag: "🇰🇷" },
            { id: 2, region: "韓國", city: "釜山", venue: "Busan Sajik Gymnasium", date: "2026 08/01–08/02", flag: "🇰🇷" },
            { id: 3, region: "日本", city: "神奈川", venue: "K-Arena Yokohama", date: "2026 08/21–08/23", flag: "🇯🇵" },
            { id: 4, region: "日本", city: "佐賀", venue: "Saga Arena", date: "2026 08/29–08/30", flag: "🇯🇵" },
            { id: 5, region: "日本", city: "大阪", venue: "Osaka-jō Hall", date: "2026 09/09–09/10", flag: "🇯🇵" },
            { id: 6, region: "日本", city: "宮城", venue: "Sekisui Heim Super Arena", date: "2026 09/19–09/20", flag: "🇯🇵" },
            { id: 7, region: "日本", city: "長野", venue: "Big Hat", date: "2026 09/25–09/26", flag: "🇯🇵" },
            { id: 8, region: "日本", city: "千葉", venue: "LaLa arena TOKYO-BAY", date: "2026 10/10–10/11", flag: "🇯🇵" },
            { id: 9, region: "北美", city: "達拉斯", venue: "The Bomb Factory", date: "2026 10/30", flag: "🇺🇸" },
            { id: 10, region: "北美", city: "佛州", venue: "Pompano Beach Amphitheater", date: "2026 11/01", flag: "🇺🇸" },
            { id: 11, region: "北美", city: "芝加哥", venue: "The Salt Shed", date: "2026 11/04", flag: "🇺🇸" },
            { id: 12, region: "北美", city: "紐約", venue: "Madison Square Garden", date: "2026 11/07", flag: "🇺🇸" },
            { id: 13, region: "北美", city: "多倫多", venue: "Queen Elizabeth Theatre", date: "2026 11/10", flag: "🇨🇦" },
            { id: 14, region: "北美", city: "溫哥華", venue: "Queen Elizabeth Theatre", date: "2026 11/13", flag: "🇨🇦" },
            { id: 15, region: "北美", city: "西雅圖", venue: "Showbox SoDo", date: "2026 11/15", flag: "🇺🇸" },
            { id: 16, region: "北美", city: "舊金山", venue: "The Warfield", date: "2026 11/17", flag: "🇺🇸" },
            { id: 17, region: "北美", city: "洛杉磯", venue: "Peacock Theater", date: "2026 11/20", flag: "🇺🇸" },
            { id: 18, region: "北美", city: "墨西哥城", venue: "Arena Ciudad de México", date: "2026 11/24", flag: "🇲🇽" },
            { id: 19, region: "亞洲", city: "雅加達", venue: "ICE BSD Hall 5-6", date: "2026 12/05", flag: "🇮🇩" },
            { id: 20, region: "亞洲", city: "吉隆坡", venue: "Unifi Arena", date: "2026 12/26", flag: "🇲🇾" },
            { id: 21, region: "亞洲", city: "台北／桃園", venue: "NTSU Arena", date: "2027 01/09", flag: "🇹🇼" },
            { id: 22, region: "亞洲", city: "香港", venue: "AsiaWorld-Arena", date: "2027 01/16", flag: "🇭🇰" },
            { id: 23, region: "亞洲", city: "新加坡", venue: "Singapore Indoor Stadium", date: "2027 01/23", flag: "🇸🇬" },
            { id: 24, region: "亞洲", city: "曼谷", venue: "Impact Arena", date: "2027 01/30", flag: "🇹🇭" }
        ];

        const regions = ["韓國", "日本", "北美", "亞洲"];

        function App() {
            const [selectedTourId, setSelectedTourId] = useState(null);
            const [expandedRegion, setExpandedRegion] = useState(null);
            const [plans, setPlans] = useState({});
            const [showModal, setShowModal] = useState(false);
            
            // 編輯狀態
            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({
                type: '', 
                content: '', 
                cost: '', 
                transportMode: '飛機', 
                flightOut: '', 
                flightBack: ''
            });

            useEffect(() => {
                const saved = localStorage.getItem('bnd-tour-v4');
                if (saved) setPlans(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('bnd-tour-v4', JSON.stringify(plans));
            }, [plans]);

            const openAddModal = (type) => {
                setEditingId(null);
                setForm({ type, content: '', cost: '', transportMode: '飛機', flightOut: '', flightBack: '' });
                setShowModal(true);
            };

            const openEditModal = (item) => {
                setEditingId(item.id);
                setForm({...item});
                setShowModal(true);
            };

            const handleSave = () => {
                const tourPlans = plans[selectedTourId] || [];
                const newItem = { ...form, id: editingId || Date.now(), cost: parseFloat(form.cost || 0) };
                
                let updatedPlans;
                if (editingId) {
                    updatedPlans = tourPlans.map(p => p.id === editingId ? newItem : p);
                } else {
                    updatedPlans = [...tourPlans, newItem];
                }

                setPlans({ ...plans, [selectedTourId]: updatedPlans });
                setShowModal(false);
            };

            const deleteItem = (id) => {
                setPlans({ ...plans, [selectedTourId]: plans[selectedTourId].filter(p => p.id !== id) });
                setShowModal(false);
            };

            const currentTour = tourData.find(t => t.id === selectedTourId);
            const total = (plans[selectedTourId] || []).reduce((s, i) => s + i.cost, 0);

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-20 px-4">
                    <header className="py-12 text-center">
                        <h1 className="text-4xl font-[900] text-blue-600 tracking-tighter mb-1 italic">KNOCK ON VOL.2</h1>
                        <p className="text-slate-400 font-bold text-[10px] tracking-[0.3em] uppercase">Tour Planner Tool</p>
                    </header>

                    {!selectedTourId ? (
                        <div className="space-y-4">
                            {regions.map(region => (
                                <div key={region} className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden transition-all">
                                    <button 
                                        onClick={() => setExpandedRegion(expandedRegion === region ? null : region)}
                                        className="w-full flex justify-between items-center p-7 hover:bg-slate-50 transition"
                                    >
                                        <span className="text-xl font-black text-slate-800">{region}</span>
                                        <i className={`fas fa-plus text-blue-500 transition-transform ${expandedRegion === region ? 'rotate-45' : ''}`}></i>
                                    </button>
                                    {expandedRegion === region && (
                                        <div className="px-5 pb-7 grid grid-cols-1 gap-2 animate-in slide-in-from-top duration-300">
                                            {tourData.filter(t => t.region === region).map(t => (
                                                <button 
                                                    key={t.id} 
                                                    onClick={() => setSelectedTourId(t.id)}
                                                    className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl hover:bg-blue-50 border border-transparent hover:border-blue-200 transition text-left"
                                                >
                                                    <div>
                                                        <div className="font-bold text-slate-700 flex items-center">
                                                            <span className="mr-2 text-lg">{t.flag}</span> {t.city}
                                                        </div>
                                                        <div className="text-[10px] text-slate-400 font-bold uppercase mt-1 tracking-wider">{t.venue}</div>
                                                    </div>
                                                    <div className="text-[11px] font-black text-blue-500 italic">{t.date.split(' ')[1]}</div>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <button onClick={() => setSelectedTourId(null)} className="mb-6 text-slate-400 font-black text-xs uppercase tracking-widest flex items-center hover:text-blue-600 transition">
                                <i className="fas fa-chevron-left mr-2"></i> Region Select
                            </button>
                            
                            <div className="bg-white rounded-[2.5rem] p-8 shadow-xl border border-blue-50 relative overflow-hidden">
                                <div className="flex justify-between items-start mb-1">
                                    <h2 className="text-4xl font-[900] text-slate-800 italic tracking-tighter">{currentTour.city}</h2>
                                    <span className="text-3xl">{currentTour.flag}</span>
                                </div>
                                <a 
                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentTour.venue + ' ' + currentTour.city)}`}
                                    target="_blank"
                                    className="inline-flex items-center text-blue-600 font-bold text-sm hover:underline"
                                >
                                    <i className="fas fa-location-arrow mr-2"></i> {currentTour.venue}
                                </a>
                                <div className="text-slate-400 text-xs font-bold mt-2 uppercase tracking-widest">{currentTour.date}</div>

                                <div className="grid grid-cols-2 gap-3 mt-10">
                                    {[
                                        {l:'住宿', i:'fa-bed', t:'住宿'}, 
                                        {l:'交通', i:'fa-plane-up', t:'交通'}, 
                                        {l:'花費', i:'fa-wallet', t:'花費'}, 
                                        {l:'行程', i:'fa-star', t:'行程'}
                                    ].map(btn => (
                                        <button 
                                            key={btn.l}
                                            onClick={() => openAddModal(btn.t)}
                                            className="flex items-center justify-center bg-slate-900 text-white p-4 rounded-2xl font-black text-sm hover:bg-blue-600 transition shadow-lg shadow-slate-200"
                                        >
                                            <i className={`fas ${btn.i} mr-3 text-blue-400`}></i> {btn.l}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-10 space-y-3">
                                    {(plans[selectedTourId] || []).map(item => (
                                        <div 
                                            key={item.id} 
                                            onClick={() => openEditModal(item)}
                                            className="bg-slate-50 p-5 rounded-3xl flex justify-between items-center border border-slate-100 cursor-pointer hover:border-blue-300 transition group"
                                        >
                                            <div className="flex-1">
                                                <div className="flex items-center mb-1">
                                                    <span className="text-[9px] font-black bg-blue-600 text-white px-2 py-0.5 rounded-md uppercase tracking-wider mr-2">
                                                        {item.type === '交通' ? item.transportMode : item.type}
                                                    </span>
                                                    {item.cost > 0 && <span className="text-xs font-black text-green-600">$ {item.cost.toLocaleString()}</span>}
                                                </div>
                                                <div className="text-slate-800 font-bold leading-tight">
                                                    {item.type === '交通' && item.transportMode === '飛機' ? (
                                                        <div className="text-sm">
                                                            <div className="flex items-center"><i className="fas fa-plane-departure mr-2 text-slate-300 text-[10px]"></i>{item.flightOut || '未填寫'}</div>
                                                            <div className="flex items-center"><i className="fas fa-plane-arrival mr-2 text-slate-300 text-[10px]"></i>{item.flightBack || '未填寫'}</div>
                                                        </div>
                                                    ) : item.content}
                                                </div>
                                            </div>
                                            <i className="fas fa-pen-to-square text-slate-200 group-hover:text-blue-400 transition text-sm"></i>
                                        </div>
                                    ))}
                                </div>
                                {total > 0 && (
                                    <div className="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                                        <span className="text-slate-400 font-black text-[10px] uppercase tracking-[0.2em]">Estimated Total</span>
                                        <span className="text-2xl font-[900] text-blue-600 italic">$ {total.toLocaleString()}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 編輯/新增對話框 */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-end sm:items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-[900] text-slate-800 italic tracking-tighter">
                                        {editingId ? 'EDIT' : 'ADD'} {form.type.toUpperCase()}
                                    </h3>
                                    {editingId && (
                                        <button onClick={() => deleteItem(editingId)} className="text-red-400 hover:text-red-600 font-bold text-xs">
                                            <i className="fas fa-trash-can mr-1"></i> DELETE
                                        </button>
                                    )}
                                </div>
                                
                                <div className="space-y-4">
                                    {form.type === '交通' && (
                                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                            {['飛機', '高鐵/火車', '巴士', '船', '其它'].map(m => (
                                                <button 
                                                    key={m}
                                                    onClick={() => setForm({...form, transportMode: m})}
                                                    className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all whitespace-nowrap ${form.transportMode === m ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'bg-slate-100 text-slate-400'}`}
                                                >{m}</button>
                                            ))}
                                        </div>
                                    )}

                                    {form.type === '交通' && form.transportMode === '飛機' ? (
                                        <div className="space-y-3">
                                            <input 
                                                className="w-full p-4 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700"
                                                placeholder="去程航班 (如: BR192)"
                                                value={form.flightOut}
                                                onChange={e => setForm({...form, flightOut: e.target.value.toUpperCase()})}
                                            />
                                            <input 
                                                className="w-full p-4 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700"
                                                placeholder="回程航班 (如: BR191)"
                                                value={form.flightBack}
                                                onChange={e => setForm({...form, flightBack: e.target.value.toUpperCase()})}
                                            />
                                        </div>
                                    ) : (
                                        <input 
                                            autoFocus
                                            className="w-full p-4 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700"
                                            placeholder={`輸入${form.type}資訊...`}
                                            value={form.content}
                                            onChange={e => setForm({...form, content: e.target.value})}
                                        />
                                    )}

                                    <div>
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 font-black">$</span>
                                            <input 
                                                type="number"
                                                className="w-full p-4 pl-8 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700"
                                                placeholder="預估金額 (可選)"
                                                value={form.cost}
                                                onChange={e => setForm({...form, cost: e.target.value})}
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-10">
                                    <button onClick={() => setShowModal(false)} className="flex-1 py-4 font-black text-slate-300 hover:text-slate-500 transition text-xs tracking-widest">CANCEL</button>
                                    <button onClick={handleSave} className="flex-2 py-4 px-10 font-[900] text-white bg-blue-600 rounded-2xl hover:bg-blue-700 shadow-xl shadow-blue-100 transition tracking-widest text-xs">SAVE</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
