<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BND 'KNOCK ON' VOL.2 Planner Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .modal-center { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
    </style>
</head>
<body class="bg-[#F1F5F9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 匯率資料 (以 2026/05/13 近似值設定)
        const RATES = {
            "KRW": 0.024,  // 1 KRW = 0.024 TWD
            "JPY": 0.21,   // 1 JPY = 0.21 TWD
            "USD": 32.5,   // 1 USD = 32.5 TWD
            "IDR": 0.002,  // 1 IDR = 0.002 TWD
            "MYR": 6.8,    // 1 MYR = 6.8 TWD
            "HKD": 4.15,   // 1 HKD = 4.15 TWD
            "SGD": 24.0,   // 1 SGD = 24.0 TWD
            "THB": 0.88,   // 1 THB = 0.88 TWD
            "MXN": 1.9     // 1 MXN = 1.9 TWD
        };

        const tourData = [
            { id: 1, region: "韓國", city: "首爾", venue: "KSPO Dome", date: "2026 07/17–07/19", currency: "KRW" },
            { id: 2, region: "韓國", city: "釜山", venue: "Busan Sajik Gymnasium", date: "2026 08/01–08/02", currency: "KRW" },
            { id: 3, region: "日本", city: "神奈川", venue: "K-Arena Yokohama", date: "2026 08/21–08/23", currency: "JPY" },
            { id: 4, region: "日本", city: "佐賀", venue: "Saga Arena", date: "2026 08/29–08/30", currency: "JPY" },
            { id: 5, region: "日本", city: "大阪", venue: "Osaka-jō Hall", date: "2026 09/09–09/10", currency: "JPY" },
            { id: 6, region: "日本", city: "宮城", venue: "Sekisui Heim Super Arena", date: "2026 09/19–09/20", currency: "JPY" },
            { id: 7, region: "日本", city: "長野", venue: "Big Hat", date: "2026 09/25–09/26", currency: "JPY" },
            { id: 8, region: "日本", city: "千葉", venue: "LaLa arena TOKYO-BAY", date: "2026 10/10–10/11", currency: "JPY" },
            { id: 12, region: "北美", city: "紐約", venue: "Madison Square Garden", date: "2026 11/07", currency: "USD" },
            { id: 21, region: "亞洲", city: "台北／桃園", venue: "NTSU Arena", date: "2027 01/09", currency: "TWD" },
            { id: 22, region: "亞洲", city: "香港", venue: "AsiaWorld-Arena", date: "2027 01/16", currency: "HKD" },
            { id: 24, region: "亞洲", city: "曼谷", venue: "Impact Arena", date: "2027 01/30", currency: "THB" }
            // 其餘場次可按此格式補齊
        ];

        const regions = ["韓國", "日本", "北美", "亞洲"];

        function App() {
            const [selectedTourId, setSelectedTourId] = useState(null);
            const [expandedRegion, setExpandedRegion] = useState(null);
            const [plans, setPlans] = useState({});
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            
            const [form, setForm] = useState({
                type: '', content: '', costTwd: '', costForeign: '', transportMode: '飛機', flightOut: '', flightBack: ''
            });

            useEffect(() => {
                const saved = localStorage.getItem('bnd-tour-v5');
                if (saved) setPlans(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('bnd-tour-v5', JSON.stringify(plans));
            }, [plans]);

            const currentTour = tourData.find(t => t.id === selectedTourId);

            // 換算邏輯
            const updateCost = (val, isTwd) => {
                const rate = RATES[currentTour.currency] || 1;
                if (isTwd) {
                    setForm({ ...form, costTwd: val, costForeign: val ? (val / rate).toFixed(0) : '' });
                } else {
                    setForm({ ...form, costForeign: val, costTwd: val ? (val * rate).toFixed(0) : '' });
                }
            };

            const handleSave = () => {
                const tourPlans = plans[selectedTourId] || [];
                const newItem = { ...form, id: editingId || Date.now(), costTwd: parseFloat(form.costTwd || 0) };
                const updatedPlans = editingId ? tourPlans.map(p => p.id === editingId ? newItem : p) : [...tourPlans, newItem];
                setPlans({ ...plans, [selectedTourId]: updatedPlans });
                setShowModal(false);
            };

            const totalTwd = (plans[selectedTourId] || []).reduce((s, i) => s + i.costTwd, 0);

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-20 px-4">
                    <header className="py-12 text-center">
                        <h1 className="text-4xl font-[900] text-blue-600 tracking-tighter mb-1 italic">KNOCK ON VOL.2</h1>
                        <p className="text-slate-400 font-bold text-[10px] tracking-[0.3em] uppercase tracking-widest">Budget & Tour Planner</p>
                    </header>

                    {!selectedTourId ? (
                        <div className="space-y-4">
                            {regions.map(region => (
                                <div key={region} className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                                    <button onClick={() => setExpandedRegion(expandedRegion === region ? null : region)} className="w-full flex justify-between items-center p-7 hover:bg-slate-50 transition">
                                        <span className="text-xl font-black text-slate-800">{region}</span>
                                        <i className={`fas fa-plus text-blue-500 transition-transform ${expandedRegion === region ? 'rotate-45' : ''}`}></i>
                                    </button>
                                    {expandedRegion === region && (
                                        <div className="px-5 pb-7 grid grid-cols-1 gap-2">
                                            {tourData.filter(t => t.region.includes(region.substring(0,2))).map(t => (
                                                <button key={t.id} onClick={() => setSelectedTourId(t.id)} className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl hover:bg-blue-50 border border-transparent hover:border-blue-200 transition text-left">
                                                    <div className="font-bold text-slate-700">{t.city}</div>
                                                    <div className="text-[11px] font-black text-blue-500 italic">{t.date.split(' ')[1]}</div>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <button onClick={() => setSelectedTourId(null)} className="mb-6 text-slate-400 font-black text-xs uppercase tracking-widest flex items-center">
                                <i className="fas fa-chevron-left mr-2"></i> Region Select
                            </button>
                            
                            <div className="bg-white rounded-[2.5rem] p-8 shadow-xl border border-blue-50 relative overflow-hidden">
                                <h2 className="text-4xl font-[900] text-slate-800 italic tracking-tighter mb-2">{currentTour.city}</h2>
                                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentTour.venue)}`} target="_blank" className="inline-flex items-center text-blue-600 font-bold text-sm">
                                    <i className="fas fa-location-arrow mr-2"></i> {currentTour.venue}
                                </a>

                                {/* 總預算 Dashboard */}
                                <div className="mt-8 p-6 bg-slate-900 rounded-[2rem] text-white shadow-lg shadow-blue-100">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Total Estimated</span>
                                        <span className="text-[10px] font-bold text-blue-400">1 {currentTour.currency} ≈ {RATES[currentTour.currency]} TWD</span>
                                    </div>
                                    <div className="text-3xl font-[900] mt-1 italic tracking-tighter text-blue-400">
                                        TWD {totalTwd.toLocaleString()}
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-3 mt-8">
                                    {[{l:'住宿', i:'fa-bed'}, {l:'交通', i:'fa-plane'}, {l:'行程', i:'fa-star'}].map(btn => (
                                        <button key={btn.l} onClick={() => { setEditingId(null); setForm({ type: btn.l, content: '', costTwd: '', costForeign: '', transportMode: '飛機', flightOut: '', flightBack: '' }); setShowModal(true); }} className="flex flex-col items-center justify-center bg-slate-50 text-slate-800 p-4 rounded-2xl font-black text-xs hover:bg-blue-600 hover:text-white transition shadow-sm border border-slate-100">
                                            <i className={`fas ${btn.i} mb-2 text-blue-500`}></i> {btn.l}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-8 space-y-3">
                                    {(plans[selectedTourId] || []).map(item => (
                                        <div key={item.id} onClick={() => { setEditingId(item.id); setForm(item); setShowModal(true); }} className="bg-white p-5 rounded-3xl flex justify-between items-center border border-slate-100 cursor-pointer hover:shadow-md transition group">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded-md uppercase">{item.type}</span>
                                                    {item.costTwd > 0 && <span className="text-[10px] font-black text-blue-600 tracking-tighter">TWD {item.costTwd.toLocaleString()}</span>}
                                                </div>
                                                <div className="text-slate-800 font-bold">
                                                    {item.type === '交通' && item.transportMode === '飛機' ? `${item.flightOut} / ${item.flightBack}` : item.content}
                                                </div>
                                            </div>
                                            <i className="fas fa-edit text-slate-200 group-hover:text-blue-500"></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 置中對話框 */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-[900] italic tracking-tighter text-slate-800">{form.type.toUpperCase()}</h3>
                                    {editingId && <button onClick={() => { setPlans({...plans, [selectedTourId]: plans[selectedTourId].filter(p => p.id !== editingId)}); setShowModal(false); }} className="text-red-400 font-bold text-xs">DELETE</button>}
                                </div>

                                <div className="space-y-4">
                                    {form.type === '交通' && (
                                        <select className="w-full p-4 bg-slate-100 rounded-2xl border-none font-bold text-slate-700 outline-none" value={form.transportMode} onChange={e => setForm({...form, transportMode: e.target.value})}>
                                            <option>飛機</option><option>高鐵/火車</option><option>其它</option>
                                        </select>
                                    )}

                                    {form.type === '交通' && form.transportMode === '飛機' ? (
                                        <div className="grid grid-cols-2 gap-2">
                                            <input className="p-4 bg-slate-100 rounded-2xl font-bold outline-none" placeholder="去程" value={form.flightOut} onChange={e => setForm({...form, flightOut: e.target.value.toUpperCase()})} />
                                            <input className="p-4 bg-slate-100 rounded-2xl font-bold outline-none" placeholder="回程" value={form.flightBack} onChange={e => setForm({...form, flightBack: e.target.value.toUpperCase()})} />
                                        </div>
                                    ) : (
                                        <input className="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none" placeholder="輸入名稱..." value={form.content} onChange={e => setForm({...form, content: e.target.value})} />
                                    )}

                                    <div className="bg-blue-50 p-5 rounded-[2rem] space-y-3 border border-blue-100">
                                        <div className="flex items-center">
                                            <span className="w-12 text-[10px] font-black text-blue-400 uppercase tracking-widest">TWD</span>
                                            <input type="number" className="flex-1 bg-transparent border-b-2 border-blue-200 outline-none font-black text-blue-600 p-1" placeholder="台幣金額" value={form.costTwd} onChange={e => updateCost(e.target.value, true)} />
                                        </div>
                                        <div className="flex items-center">
                                            <span className="w-12 text-[10px] font-black text-slate-400 uppercase tracking-widest">{currentTour.currency}</span>
                                            <input type="number" className="flex-1 bg-transparent border-b-2 border-slate-200 outline-none font-black text-slate-500 p-1" placeholder={`${currentTour.city}幣值`} value={form.costForeign} onChange={e => updateCost(e.target.value, false)} />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-4 mt-8">
                                    <button onClick={() => setShowModal(false)} className="flex-1 py-4 font-bold text-slate-300">CLOSE</button>
                                    <button onClick={handleSave} className="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-100">SAVE PLAN</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
