<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BND 'KNOCK ON' VOL.2 Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const tourData = [
            { id: 1, region: "韓國 🇰🇷", city: "首爾", venue: "KSPO Dome", date: "2026 07/17–07/19" },
            { id: 2, region: "韓國 🇰🇷", city: "釜山", venue: "Busan Sajik Gymnasium", date: "2026 08/01–08/02" },
            { id: 3, region: "日本 🇯🇵", city: "神奈川", venue: "K-Arena Yokohama", date: "2026 08/21–08/23" },
            { id: 4, region: "日本 🇯🇵", city: "佐賀", venue: "Saga Arena", date: "2026 08/29–08/30" },
            { id: 5, region: "日本 🇯🇵", city: "大阪", venue: "Osaka-jō Hall", date: "2026 09/09–09/10" },
            { id: 6, region: "日本 🇯🇵", city: "宮城", venue: "Sekisui Heim Super Arena", date: "2026 09/19–09/20" },
            { id: 7, region: "日本 🇯🇵", city: "長野", venue: "Big Hat", date: "2026 09/25–09/26" },
            { id: 8, region: "日本 🇯🇵", city: "千葉", venue: "LaLa arena TOKYO-BAY", date: "2026 10/10–10/11" },
            { id: 9, region: "北美 🇺🇸", city: "達拉斯", venue: "The Bomb Factory", date: "2026 10/30" },
            { id: 12, region: "北美 🇺🇸", city: "紐約", venue: "Madison Square Garden", date: "2026 11/07" },
            { id: 17, region: "北美 🇺🇸", city: "洛杉磯", venue: "Peacock Theater", date: "2026 11/20" },
            { id: 21, region: "亞洲 🇹🇼", city: "台北/桃園", venue: "NTSU Arena", date: "2027 01/09" },
            { id: 22, region: "亞洲 🇭🇰", city: "香港", venue: "AsiaWorld-Arena", date: "2027 01/16" },
            { id: 24, region: "亞洲 🇹🇭", city: "曼谷", venue: "Impact Arena", date: "2027 01/30" }
            // ... 可自行補齊其餘場次
        ];

        const regions = ["韓國 🇰🇷", "日本 🇯🇵", "北美 🇺🇸", "亞洲 🇹🇼"];

        function App() {
            const [selectedTourId, setSelectedTourId] = useState(null);
            const [plans, setPlans] = useState({});
            const [showModal, setShowModal] = useState(false);
            const [tempItem, setTempItem] = useState({ type: '', content: '', cost: '' });

            useEffect(() => {
                const saved = localStorage.getItem('bnd-plans-v2');
                if (saved) setPlans(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('bnd-plans-v2', JSON.stringify(plans));
            }, [plans]);

            const openModal = (type) => {
                setTempItem({ type, content: '', cost: '' });
                setShowModal(true);
            };

            const handleSave = () => {
                if (!tempItem.content) return;
                const newPlans = {...plans};
                if (!newPlans[selectedTourId]) newPlans[selectedTourId] = [];
                newPlans[selectedTourId].push({ 
                    id: Date.now(), 
                    ...tempItem, 
                    cost: parseFloat(tempItem.cost || 0) 
                });
                setPlans(newPlans);
                setShowModal(false);
            };

            const currentTour = tourData.find(t => t.id === selectedTourId);

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-10 px-4">
                    <header className="py-8 text-center">
                        <h1 className="text-4xl font-black text-[#2563EB] tracking-tighter">KNOCK ON VOL.2</h1>
                        <div className="mt-2 text-xs font-bold text-white bg-black inline-block px-3 py-1 rounded-full uppercase">ONEDOOR Tour Tool</div>
                    </header>

                    {!selectedTourId ? (
                        <div className="space-y-6">
                            {regions.map(region => (
                                <div key={region} className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                        <span className="w-1.5 h-6 bg-blue-500 rounded-full mr-2"></span>{region}
                                    </h3>
                                    <div className="grid grid-cols-1 gap-3">
                                        {tourData.filter(t => t.region.includes(region.substring(0,2))).map(t => (
                                            <button 
                                                key={t.id} 
                                                onClick={() => setSelectedTourId(t.id)}
                                                className="flex justify-between items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-2xl transition-all border border-transparent hover:border-blue-200 group text-left"
                                            >
                                                <div>
                                                    <div className="font-bold text-slate-700">{t.city}</div>
                                                    <div className="text-xs text-slate-400">{t.date}</div>
                                                </div>
                                                <i className="fas fa-chevron-right text-slate-300 group-hover:text-blue-500"></i>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <button onClick={() => setSelectedTourId(null)} className="mb-4 text-slate-500 font-bold flex items-center">
                                <i className="fas fa-arrow-left mr-2"></i> 返回區域選擇
                            </button>
                            
                            <div className="bg-white rounded-[2rem] p-8 shadow-2xl border border-blue-100 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-6 opacity-10 text-6xl font-black italic">BND</div>
                                <h2 className="text-3xl font-black text-slate-800">{currentTour.city}</h2>
                                <a 
                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentTour.venue)}`}
                                    target="_blank"
                                    className="text-blue-500 font-bold flex items-center mt-1 hover:underline"
                                >
                                    <i className="fas fa-map-marker-alt mr-2"></i> {currentTour.venue}
                                </a>
                                <p className="text-slate-400 text-sm mt-1">{currentTour.date}</p>

                                <div className="grid grid-cols-2 gap-3 mt-8">
                                    {[
                                        {l:'🏠 住宿', i:'fa-hotel'}, {l:'✈️ 交通', i:'fa-plane'}, 
                                        {l:'💰 花費', i:'fa-comment-dollar'}, {l:'📍 行程', i:'fa-calendar-day'}
                                    ].map(item => (
                                        <button 
                                            key={item.l}
                                            onClick={() => openModal(item.l)}
                                            className="flex items-center justify-center bg-blue-600 text-white p-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition"
                                        >
                                            <i className={`fas ${item.i} mr-2`}></i> {item.l}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-8 space-y-4">
                                    {(plans[selectedTourId] || []).map(item => (
                                        <div key={item.id} className="group bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-slate-100">
                                            <div>
                                                <div className="text-[10px] font-black text-blue-500 uppercase tracking-widest">{item.type}</div>
                                                <div className="text-slate-700 font-bold">{item.content}</div>
                                                {item.cost > 0 && <div className="text-green-600 font-black mt-1">${item.cost}</div>}
                                            </div>
                                            <button onClick={() => {
                                                const updated = plans[selectedTourId].filter(i => i.id !== item.id);
                                                setPlans({...plans, [selectedTourId]: updated});
                                            }} className="text-slate-300 hover:text-red-500 p-2"><i className="fas fa-trash-alt"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 輸入對話框 (Modal) */}
                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-50">
                            <div className="bg-white w-full max-w-sm rounded-[2rem] p-8 shadow-2xl animate-in zoom-in duration-200">
                                <h3 className="text-xl font-black mb-6 flex items-center text-slate-800">
                                    <i className="fas fa-edit mr-3 text-blue-500"></i> 新增 {tempItem.type}
                                </h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 ml-1">細節描述</label>
                                        <input 
                                            autoFocus
                                            className="w-full p-4 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none"
                                            placeholder="例如: 某某飯店、BR192航班..."
                                            value={tempItem.content}
                                            onChange={e => setTempItem({...tempItem, content: e.target.value})}
                                        />
                                    </div>
                                    {tempItem.type === '💰 花費' && (
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 ml-1">金額</label>
                                            <input 
                                                type="number"
                                                className="w-full p-4 bg-slate-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none"
                                                placeholder="請輸入數字"
                                                value={tempItem.cost}
                                                onChange={e => setTempItem({...tempItem, cost: e.target.value})}
                                            />
                                        </div>
                                    )}
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowModal(false)} className="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl hover:bg-slate-200 transition">取消</button>
                                    <button onClick={handleSave} className="flex-1 py-4 font-bold text-white bg-blue-600 rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition">儲存</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
